<!DOCTYPE html>
<html lang="en">
<head>
  <!-- EXTRA HTML details: UTF-8 and a viewport for different window sizes.
       https://developer.mozilla.org/en-US/docs/Web/HTML/Element/meta -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dreamwave - ART151</title>
  <style>
    /* Course source: IntrotoCSS.pdf, pages 6, 13-14 and 17.
       EXTRA: display:block prevents a gap underneath the canvas.
       https://developer.mozilla.org/en-US/docs/Web/CSS/display */
    body { margin: 0; background-color: #10152f; }
    canvas { display: block; }
  </style>
  <!-- Matching, pinned p5.js and p5.sound versions. Internet is required. -->
  <!-- EXTRA: the script element loads the JavaScript libraries.
       https://developer.mozilla.org/en-US/docs/Web/HTML/Element/script -->
  <script src="https://cdn.jsdelivr.net/npm/p5@1.11.3/lib/p5.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/p5@1.11.3/lib/addons/p5.sound.min.js"></script>
</head>
<body>
<script>
// DREAMWAVE: a relaxing ocean landscape played with an 8BitDo Pro 2.
// ART151 foundation: Introto_p5js (1)(1).pdf, slides 6-51.
// HTML structure: IntrotoHTML.pdf, pages 4-6 and 13.
// File choice: Computer_Code_Basics_File_ Types and Extensions.pdf, pages 6-7.
// Concept planning: 2_research_brainstorm_intro.pdf, list making, page 9.
// Uses variables, arrays, loops, if/else, map(), shapes, colors and interaction.
// Extensions beyond the supplied slides are labeled EXTRA with source links.
// This is original code drafted with ChatGPT assistance, using the references.
// The linked documentation explains techniques; this is not a copied demo.

// LIVE CODING: these four numbers are easy to change and explain on Zoom.
let waveLayers = 5;    // Try 7 for a deeper ocean.
let waveHeight = 26;   // Try 38 for taller waves.
let waveSpeed = 0.008; // A smaller number makes the water move more slowly.
let starCount = 65;    // Try 100 for a sky with more stars (maximum 180).

let phase = 0;
let scene = 0;
let sceneNames = ["Lavender dusk", "Moonlight", "Peach dawn"];
let skyTop, skyBottom, seaColor, lightColor;
let moonX = 0.72;
let moonY = 0.26;
let swell = waveHeight;
let flow = waveSpeed;
let glow = 0;
let surf = 0;
let paused = false;
let muted = false;
let showHelp = true;
let volumeLevel = 0.35;

// Parallel arrays store the positions and sizes of the stars and ripples.
let starX = [], starY = [], starSize = [];
let rippleX = [], rippleY = [], rippleSize = [], rippleAlpha = [];
let nextRipple = 0;

// Controller state. Never assume the controller is always in slot 0.
let pad = null;
let padIndex = -1;
let padID = "";
let wasDown = [];
let controllerMessage = "Connect your controller, then press a button.";
let pressedButtons = "none";
let gamepadBlocked = false;

// Sound state. Each note has its own oscillator and envelope.
let soundReady = false;
let lastVolume = -1;
let soundMessage = "Click the landscape to enable sound.";
let notes = [261.63, 293.66, 392.00, 440.00]; // C4, D4, G4, A4.
let chimes = [], envelopes = [];
let oceanNoise, drone;

function setup() {
  let canvas = createCanvas(windowWidth, windowHeight);
  frameRate(60);

  // EXTRA: make the canvas focusable, so clicking it restores keyboard control.
  // https://v1.p5js.org/reference/p5.Element/attribute/
  // https://v1.p5js.org/reference/p5.Element/mousePressed/
  // https://developer.mozilla.org/en-US/docs/Web/API/HTMLElement/focus
  canvas.attribute("tabindex", "0");
  canvas.attribute("aria-label", "Dreamwave interactive ocean. Click for sound.");
  canvas.mousePressed(function () { canvas.elt.focus(); });

  skyTop = color(23, 20, 58);
  skyBottom = color(184, 122, 166);
  seaColor = color(22, 75, 106);
  lightColor = color(250, 215, 221);

  for (let i = 0; i < 180; i++) {
    starX[i] = random(0, 1);
    starY[i] = random(0.06, 0.43);
    starSize[i] = random(1, 2.6);
  }
  for (let i = 0; i < 12; i++) {
    rippleX[i] = 0;
    rippleY[i] = 0;
    rippleSize[i] = 0;
    rippleAlpha[i] = 0;
  }
}

function draw() {
  // EXTRA: deltaTime keeps movement similar when the frame rate changes.
  // min() prevents a large jump after returning to a background browser tab.
  // https://v1.p5js.org/reference/p5/deltaTime/
  // https://v1.p5js.org/reference/p5/min/
  let step = min(deltaTime, 50) / 16.667;
  readController(); // Keep reading while paused so START can resume.
  if (!paused) {
    updateLandscape(step);
    phase += flow * step;
    updateColors();
  }
  drawSky();
  drawMoon();
  drawWater();
  drawRipples(step);
  drawLabels();
  updateSound();
}

function updateColors() {
  // lerpColor() is covered in the supplied ART151 slides.
  let top = color(23, 20, 58);
  let bottom = color(184, 122, 166);
  let water = color(22, 75, 106);
  let light = color(250, 215, 221);
  if (scene === 1) {
    top = color(4, 13, 33);
    bottom = color(57, 91, 128);
    water = color(13, 53, 79);
    light = color(184, 231, 241);
  } else if (scene === 2) {
    top = color(55, 63, 112);
    bottom = color(240, 170, 152);
    water = color(35, 104, 127);
    light = color(255, 230, 183);
  }
  skyTop = lerpColor(skyTop, top, 0.025);
  skyBottom = lerpColor(skyBottom, bottom, 0.025);
  seaColor = lerpColor(seaColor, water, 0.025);
  lightColor = lerpColor(lightColor, light, 0.025);
}

function drawSky() {
  // A loop of colored horizontal lines makes the sky gradient.
  // EXTRA: strokeWeight() controls the thickness of those lines.
  // https://v1.p5js.org/reference/p5/strokeWeight/
  strokeWeight(3);
  for (let y = 0; y < height; y += 3) {
    stroke(lerpColor(skyTop, skyBottom, map(y, 0, height, 0, 1)));
    line(0, y, width, y);
  }
  noStroke();
  for (let i = 0; i < min(starCount, 180); i++) {
    // EXTRA: sin() makes smooth repeating changes instead of sudden jumps.
    // https://v1.p5js.org/reference/p5/sin/
    let brightness = 110 + 65 * sin(phase * 0.7 + i);
    fill(240, 238, 255, brightness);
    circle(starX[i] * width, starY[i] * height, starSize[i]);
  }
}

function drawMoon() {
  push(); // Save this drawing group's style and position.
  // EXTRA: translate() moves the origin to the moon's position.
  // https://v1.p5js.org/reference/p5/translate/
  translate(moonX * width, moonY * height);
  noStroke();
  let moonSize = min(width, height) * 0.105;
  for (let i = 7; i > 0; i--) {
    fill(229, 219, 255, 3 + glow * 4);
    circle(0, 0, moonSize + i * (12 + glow * 9));
  }
  fill(lightColor);
  circle(0, 0, moonSize);
  pop(); // Restore the previous drawing state.
}

function drawWater() {
  noStroke();
  fill(seaColor);
  rect(0, height * 0.51, width, height * 0.49);
  for (let layer = 0; layer < waveLayers; layer++) {
    let depth = map(layer, 0, waveLayers, 0, 1);
    let baseY = height * (0.53 + depth * 0.40);
    let amplitude = swell * (0.25 + depth * 0.8);
    let waveColor = lerpColor(seaColor, color(7, 23, 48), depth * 0.75);
    fill(waveColor);
    stroke(lerpColor(waveColor, lightColor, 0.22 + surf * 0.22));
    strokeWeight(1.2);
    // EXTRA: vertex() supplies the points of a beginShape()/endShape() shape.
    // https://v1.p5js.org/reference/p5/vertex/
    beginShape();
    for (let x = -10; x <= width + 10; x += 10) {
      let y = baseY + sin(x * 0.006 + phase + layer) * amplitude;
      y += sin(x * 0.011 - phase * 0.65 + layer) * amplitude * 0.28;
      vertex(x, y);
    }
    vertex(width + 10, height + 10);
    vertex(-10, height + 10);
    endShape(CLOSE);
  }
  // Small horizontal lines suggest moonlight reflected on the water.
  strokeWeight(1.5);
  for (let i = 0; i < 38; i++) {
    let y = height * 0.54 + i * height * 0.011;
    let x = moonX * width + sin(phase + i * 1.8) * (9 + i);
    let halfLength = 7 + i * 1.4 + sin(phase + i) * 6;
    stroke(232, 222, 253, 53 - i);
    line(x - halfLength, y, x + halfLength, y);
  }
}

function drawRipples(step) {
  push();
  noFill();
  strokeWeight(1.5);
  for (let i = 0; i < 12; i++) {
    if (rippleAlpha[i] > 0) {
      stroke(220, 240, 255, rippleAlpha[i]);
      ellipse(rippleX[i] * width, rippleY[i] * height,
              rippleSize[i], rippleSize[i] * 0.28);
      if (!paused) {
        rippleSize[i] += 1.7 * step;
        rippleAlpha[i] -= 0.65 * step;
      }
    }
  }
  pop();
}

function updateLandscape(step) {
  let leftX = 0, leftY = 0, rightX = 0, rightY = 0;
  let leftTrigger = 0, rightTrigger = 0;
  if (pad && pad.mapping === "standard") {
    leftX = deadZone(pad.axes[0]);
    leftY = deadZone(pad.axes[1]);
    rightX = deadZone(pad.axes[2]);
    rightY = deadZone(pad.axes[3]);
    leftTrigger = pad.buttons[6].value;
    rightTrigger = pad.buttons[7].value;
  }
  // Keyboard controls are useful during practice or a controller disconnect.
  if (keyIsDown(LEFT_ARROW)) leftX = -1;
  if (keyIsDown(RIGHT_ARROW)) leftX = 1;
  if (keyIsDown(UP_ARROW)) leftY = -1;
  if (keyIsDown(DOWN_ARROW)) leftY = 1;
  if (keyIsDown(65)) rightX = -1; // A
  if (keyIsDown(68)) rightX = 1;  // D
  if (keyIsDown(87)) rightY = -1; // W
  if (keyIsDown(83)) rightY = 1;  // S
  if (keyIsDown(81)) leftTrigger = 1;  // Q
  if (keyIsDown(69)) rightTrigger = 1; // E

  // EXTRA: lerp() eases toward a value; constrain() keeps values in bounds.
  // https://v1.p5js.org/reference/p5/lerp/
  // https://v1.p5js.org/reference/p5/constrain/
  swell = lerp(swell, constrain(waveHeight - leftY * 20, 6, 90), 0.035);
  flow = lerp(flow, waveSpeed + leftX * 0.012, 0.035);
  glow = lerp(glow, leftTrigger, 0.04);
  surf = lerp(surf, rightTrigger, 0.04);
  moonX = constrain(moonX + rightX * 0.002 * step, 0.12, 0.88);
  moonY = constrain(moonY + rightY * 0.0015 * step, 0.14, 0.39);
}

function deadZone(value) {
  // EXTRA: ignore small stick movements caused by a stick resting off center.
  // abs() returns the distance from zero. The remaining range is rescaled.
  // https://v1.p5js.org/reference/p5/abs/
  if (value === undefined || abs(value) < 0.16) return 0;
  if (value > 0) return map(value, 0.16, 1, 0, 1);
  return map(value, -1, -0.16, -1, 0);
}

function readController() {
  // EXTRA: game controllers use the browser's Gamepad API, not a p5 command.
  // https://developer.mozilla.org/en-US/docs/Web/API/Gamepad_API/Using_the_Gamepad_API
  // https://w3c.github.io/gamepad/#standard-gamepad-layout
  // try/catch handles a browser or iframe that blocks this API.
  // https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Statements/try...catch
  pad = null;
  if (!navigator.getGamepads || gamepadBlocked) {
    controllerMessage = "Controller unavailable here. Use HTTPS / a new tab.";
    return;
  }
  try {
    let pads = navigator.getGamepads();
    // Keep using the selected controller while it remains connected.
    if (padIndex >= 0 && pads[padIndex] && pads[padIndex].connected) {
      pad = pads[padIndex];
    } else {
      for (let i = 0; i < pads.length; i++) {
        if (pads[i] && pads[i].connected) { pad = pads[i]; break; }
      }
    }
  } catch (error) {
    gamepadBlocked = true;
    controllerMessage = "Controller blocked here. Open the saved sketch in a new tab.";
    return;
  }
  if (!pad) {
    padIndex = -1;
    padID = "";
    wasDown = [];
    pressedButtons = "none";
    controllerMessage = "Connect your controller, then press a button.";
    return;
  }
  if (pad.index !== padIndex || pad.id !== padID) {
    padIndex = pad.index;
    padID = pad.id;
    // Ignore buttons held during connection, including the wake-up press.
    for (let i = 0; i < pad.buttons.length; i++) wasDown[i] = pad.buttons[i].pressed;
  }
  pressedButtons = "";
  for (let i = 0; i < pad.buttons.length; i++) {
    let down = pad.buttons[i].pressed;
    if (down) pressedButtons += i + " ";
    if (pad.mapping === "standard" && down && !wasDown[i]) controllerAction(i);
    wasDown[i] = down;
  }
  if (pressedButtons === "") pressedButtons = "none";
  // EXTRA: standard mapping is important; printed ABXY labels can differ.
  // https://developer.mozilla.org/en-US/docs/Web/API/Gamepad/mapping
  if (pad.mapping !== "standard") {
    controllerMessage = "Mapping not standard: on Windows, use X mode and reconnect.";
  } else {
    controllerMessage = "Controller connected - standard mapping";
  }
}

function controllerAction(button) {
  // Standard API indices describe positions, not the letters printed on Pro 2.
  if (button === 9) { paused = !paused; return; } // START
  if (button === 8) { muted = !muted; return; }   // SELECT
  if (button === 11) { showHelp = !showHelp; return; } // Right stick click
  if (paused) return;
  if (button >= 0 && button <= 3) playNote(button);
  if (button === 4 || button === 14) scene = (scene + 2) % 3;
  if (button === 5 || button === 15) scene = (scene + 1) % 3;
  if (button === 10) { moonX = 0.72; moonY = 0.26; } // Left stick click
  if (button === 12) volumeLevel = constrain(volumeLevel + 0.05, 0, 0.7);
  if (button === 13) volumeLevel = constrain(volumeLevel - 0.05, 0, 0.7);
}

function startSound() {
  // EXTRA: browsers require a click/key gesture before sound can begin.
  // https://v1.p5js.org/reference/p5/userStartAudio/
  userStartAudio();
  if (soundReady) return;
  // EXTRA: these sound-synthesis classes are beyond the introductory slides.
  // https://v1.p5js.org/reference/p5.sound/p5.Oscillator/
  // https://v1.p5js.org/reference/p5.sound/p5.Envelope/
  // https://v1.p5js.org/reference/p5.Envelope/setADSR/
  // https://v1.p5js.org/reference/p5.Envelope/setRange/
  // https://v1.p5js.org/reference/p5.Envelope/play/
  for (let i = 0; i < 4; i++) {
    chimes[i] = new p5.Oscillator("sine");
    chimes[i].freq(notes[i]);
    chimes[i].amp(0);
    chimes[i].start();
    envelopes[i] = new p5.Envelope();
    envelopes[i].setADSR(0.05, 0.3, 0.15, 2.4);
    envelopes[i].setRange(0.12, 0);
  }
  // EXTRA: quiet pink noise suggests surf; a low sine tone adds warmth.
  // https://v1.p5js.org/reference/p5.sound/p5.Noise/
  oceanNoise = new p5.Noise("pink");
  oceanNoise.amp(0);
  oceanNoise.start();
  drone = new p5.Oscillator("sine");
  drone.freq(130.81); // C3, a low note that fits the four chime notes.
  drone.amp(0);
  drone.start();
  soundReady = true;
}

function updateSound() {
  if (!soundReady) return;
  // EXTRA: outputVolume() changes the sketch's overall sound level.
  // Only schedule a fade when that level changes.
  // https://v1.p5js.org/reference/p5/outputVolume/
  let targetVolume = volumeLevel;
  if (muted || paused) targetVolume = 0;
  if (targetVolume !== lastVolume) {
    outputVolume(targetVolume, 0.08);
    lastVolume = targetVolume;
  }
  oceanNoise.amp(0.018 + surf * 0.065 + 0.006 * sin(phase * 0.6), 0.1);
  drone.amp(0.018 + glow * 0.025, 0.1);
  // EXTRA: check the actual audio context instead of assuming sound started.
  // https://v1.p5js.org/reference/p5/getAudioContext/
  if (getAudioContext().state !== "running") {
    soundMessage = "Click the landscape to resume audio.";
  } else if (muted) {
    soundMessage = "Sound muted - SELECT or M to restore";
  } else if (paused) {
    soundMessage = "Paused - START or Space to resume";
  } else {
    soundMessage = "Sound on - play slowly and leave space between notes";
  }
}

function playNote(which) {
  if (paused) return;
  rippleX[nextRipple] = 0.22 + which * 0.19;
  rippleY[nextRipple] = 0.66 + (which % 2) * 0.12;
  rippleSize[nextRipple] = 8;
  rippleAlpha[nextRipple] = 170;
  nextRipple = (nextRipple + 1) % 12; // Reuse slots so the arrays stay small.
  if (soundReady && !muted) envelopes[which].play(chimes[which], 0, 0.08);
}

function drawLabels() {
  noStroke();
  fill(249, 239, 255);
  textFont("Georgia");
  textSize(34);
  text("Dreamwave", 28, 52);
  textFont("sans-serif");
  textSize(12);
  fill(230, 224, 246, 210);
  text("A LANDSCAPE YOU CAN PLAY", 30, 74);
  text(sceneNames[scene], 30, 101);
  if (paused) text("PAUSED", 30, 124);
  if (!showHelp) {
    text("H / right stick click: show controls", 24, height - 24);
    return;
  }
  fill(6, 15, 37, 195);
  rect(14, height - 164, width - 28, 150, 12);
  fill(237, 239, 252);
  textSize(12);
  let panelText = controllerMessage + "\n" + soundMessage;
  panelText += "\nLeft stick: waves | Right stick: moon | Face buttons: notes + ripples";
  panelText += "\nL / R: sky | L2: glow | R2: surf | START: pause | SELECT: mute";
  panelText += "\nKeys: Z X C V notes | 1 2 3 skies | arrows waves | WASD moon | Q/E triggers";
  panelText += "\nSpace pause | M mute | H hide | D-pad up/down volume | Buttons: " + pressedButtons;
  textLeading(19);
  text(panelText, 28, height - 141, width - 56, 140);
}

function mousePressed() {
  startSound(); // Clicking starts/resumes audio without automatically playing a note.
}

function keyPressed(event) {
  // EXTRA: ignore automatic key repeats and browser shortcuts.
  // https://developer.mozilla.org/en-US/docs/Web/API/KeyboardEvent/repeat
  if (event && (event.repeat || event.ctrlKey || event.metaKey || event.altKey)) return;
  if (key === "m" || key === "M") muted = !muted;
  else if (key === "h" || key === "H") showHelp = !showHelp;
  else if (keyCode === 32) paused = !paused;
  else if (!paused && key === "1") scene = 0;
  else if (!paused && key === "2") scene = 1;
  else if (!paused && key === "3") scene = 2;
  else if (!paused && (key === "z" || key === "Z")) playNote(0);
  else if (!paused && (key === "x" || key === "X")) playNote(1);
  else if (!paused && (key === "c" || key === "C")) playNote(2);
  else if (!paused && (key === "v" || key === "V")) playNote(3);
  else if (keyCode < 37 || keyCode > 40) return;
  return false; // Prevent handled keys, especially arrows/Space, from scrolling.
}

function windowResized() {
  // EXTRA: keep the canvas fitted to the browser and Zoom sharing window.
  // https://v1.p5js.org/reference/p5/windowResized/
  // https://v1.p5js.org/reference/p5/resizeCanvas/
  resizeCanvas(windowWidth, windowHeight);
}

// EXTRA: pause when this page is hidden, so sound does not continue unseen.
// This event also works if the animation loop stops in a background tab.
// https://developer.mozilla.org/en-US/docs/Web/API/Document/visibilitychange_event
document.addEventListener("visibilitychange", function () {
  if (document.hidden) {
    paused = true;
    if (soundReady) { outputVolume(0, 0.08); lastVolume = 0; }
  }
});
</script>
</body>
</html>
